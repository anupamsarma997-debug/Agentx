name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew

      - name: Restore debug.keystore from base64
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare environment configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_REDIRECT_URI: ${{ secrets.META_REDIRECT_URI }}
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_API_KEY|" .env || echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi
          if [ -n "$META_APP_ID" ]; then
            sed -i "s|^META_APP_ID=.*|META_APP_ID=$META_APP_ID|" .env || echo "META_APP_ID=$META_APP_ID" >> .env
          fi
          if [ -n "$META_REDIRECT_URI" ]; then
            sed -i "s|^META_REDIRECT_URI=.*|META_REDIRECT_URI=$META_REDIRECT_URI|" .env || echo "META_REDIRECT_URI=$META_REDIRECT_URI" >> .env
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/SocialAgent.apk
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/SocialAgent-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialAgent-APK
          path: build-artifacts/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && !github.event.pull_request
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "SocialAgent Android APK (Build #${{ github.run_number }})"
          make_latest: true
          body: |
            ## 📱 SocialAgent - Latest Android APK

            Download and install the APK directly on your Android phone:
            - **SocialAgent.apk** (Latest compiled build)

            ### ✨ Highlights:
            - **Build Number:** #${{ github.run_number }}
            - **Status:** Verified clean compilation
            - **Features:** Instant Post Generator, Assam & Northeast Citizen Schemes & Defense Portals, Verification Guardrails, Meta/Facebook Integration.

            ### 📲 Installation Guide:
            1. Tap on `SocialAgent.apk` below to download.
            2. Open the downloaded file on your Android device.
            3. If prompted by Android, tap "Allow install from unknown sources" or "Install anyway".
          files: |
            build-artifacts/SocialAgent.apk
            build-artifacts/SocialAgent-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
