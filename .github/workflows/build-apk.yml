name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Restore debug.keystore from base64 if present
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare environment configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_REDIRECT_URI: ${{ secrets.META_REDIRECT_URI }}
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            sed -i "s|^GEMINI_API_KEY=.*|GEMINI_API_KEY=$GEMINI_API_KEY|" .env || echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/SocialAgent-Latest.apk
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/SocialAgent.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialAgent-APK
          path: build-artifacts/SocialAgent-Latest.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "SocialAgent Latest APK"
          body: |
            ## 📱 SocialAgent - Latest Android APK
            
            Directly download the latest APK below and install on your Android device:
            - **SocialAgent.apk**: Direct installable Android application package.
            
            ### ✨ Features:
            - Instant Post Generation & Direct Publishing
            - 130+ Assam & Northeast Citizen Portals & Schemes
            - Anti-duplication tracking with Room Database
          files: build-artifacts/SocialAgent.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
